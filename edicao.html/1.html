<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recorte por Barras (250x250) + Formatos + Conta-gotas</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .controles {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 12px;
      background: #f4f4f4;
      border-radius: 8px;
    }
    .grupo-campo {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    select {
      padding: 7px 10px;
      border-radius: 4px;
      border: 1px solid #bbb;
      background: #fff;
      cursor: pointer;
    }
    .painel-cor {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 15px;
      border-left: 2px solid #ccc;
    }
    .amostra-cor {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #999;
      background-color: #ffffff;
    }
    .dica {
      font-size: 13px;
      color: #444;
      margin-top: 10px;
    }
    .galeria { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    canvas {
      width: 250px;
      height: 250px;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    canvas.modo-barras { cursor: default; }
    canvas.modo-conta-gotas { cursor: crosshair; }
    button { padding: 8px 14px; cursor: pointer; }
    button.ativo { background-color: #0066cc; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="controles">
    <input type="file" id="seletor" multiple accept="image/*">

    <div class="grupo-campo">
      <label for="seletor-formato"><strong>Formato:</strong></label>
      <select id="seletor-formato">
        <option value="circulo" selected>Círculo</option>
        <option value="quadrado">Quadrado</option>
        <option value="coracao">Coração</option>
        <option value="estrela">Estrela</option>
        <option value="barras">Personalizado (barras)</option>
      </select>
    </div>

    <button id="btn-resetar-barras" type="button">Resetar barras</button>
    <button id="btn-conta-gotas" type="button">Conta-gotas: Desativado</button>

    <div class="painel-cor">
      <div class="amostra-cor" id="amostra-cor" title="Cor selecionada"></div>
      <span id="texto-hex">#FFFFFF</span>
      <button type="button" onclick="copiarTexto('texto-hex', this)">Copiar HEX</button>
      <span id="texto-rgb">rgb(255, 255, 255)</span>
      <button type="button" onclick="copiarTexto('texto-rgb', this)">Copiar RGB</button>
    </div>
  </div>

  <div class="dica">
    <strong>Como usar:</strong> No modo <strong>Personalizado (barras)</strong>, arraste as barras das bordas para escolher o tamanho e a área desejada. Nos demais formatos, arraste para mover e use a roda do mouse para zoom.
  </div>

  <div class="galeria" id="galeria"></div>

  <script>
    const tamanhoFinal = 250;
    const tamanhoMinimoCaixa = 30;
    let contaGotasAtivo = false;
    let formatoAtual = 'circulo';
    const redesenhos = [];
    const resetadoresBarras = [];

    const btnContaGotas = document.getElementById('btn-conta-gotas');
    const btnResetarBarras = document.getElementById('btn-resetar-barras');
    const seletorFormato = document.getElementById('seletor-formato');

    function atualizarCursoCanvases() {
      document.querySelectorAll('canvas').forEach(c => {
        c.classList.toggle('modo-conta-gotas', contaGotasAtivo);
        c.classList.toggle('modo-barras', !contaGotasAtivo && formatoAtual === 'barras');
      });
    }

    btnContaGotas.addEventListener('click', function () {
      contaGotasAtivo = !contaGotasAtivo;
      btnContaGotas.textContent = contaGotasAtivo
        ? 'Conta-gotas: Ativo (clique na foto)'
        : 'Conta-gotas: Desativado';
      btnContaGotas.classList.toggle('ativo', contaGotasAtivo);
      atualizarCursoCanvases();
      redesenhos.forEach(fn => fn());
    });

    seletorFormato.addEventListener('change', function () {
      formatoAtual = seletorFormato.value;
      atualizarCursoCanvases();
      redesenhos.forEach(fn => fn());
    });

    btnResetarBarras.addEventListener('click', function () {
      resetadoresBarras.forEach(fn => fn());
    });

    function copiarTexto(idElemento, botao) {
      const valor = document.getElementById(idElemento).textContent;
      navigator.clipboard.writeText(valor);
      const textoOriginal = botao.textContent;
      botao.textContent = 'Copiado!';
      setTimeout(() => botao.textContent = textoOriginal, 1200);
    }

    function criarCaminhoEmCaixa(ctx, formato, x, y, w, h) {
      const cx = x + w / 2;
      const cy = y + h / 2;
      ctx.beginPath();

      if (formato === 'circulo') {
        ctx.ellipse(cx, cy, w / 2, h / 2, 0, 0, Math.PI * 2);
      } else if (formato === 'quadrado' || formato === 'barras') {
        ctx.rect(x, y, w, h);
      } else if (formato === 'coracao') {
        const topoY = y + h * 0.25;
        ctx.moveTo(cx, y + h * 0.92);
        ctx.bezierCurveTo(
          x + w * 0.08, y + h * 0.65,
          x + w * 0.02, topoY,
          cx, y + h * 0.42
        );
        ctx.bezierCurveTo(
          x + w * 0.98, topoY,
          x + w * 0.92, y + h * 0.65,
          cx, y + h * 0.92
        );
      } else if (formato === 'estrela') {
        const pontas = 5;
        const raioExternoX = w * 0.48;
        const raioInternoX = w * 0.22;
        const raioExternoY = h * 0.48;
        const raioInternoY = h * 0.22;
        const centroEstrelaY = y + h * 0.52;

        for (let i = 0; i < pontas * 2; i++) {
          const rx = i % 2 === 0 ? raioExternoX : raioInternoX;
          const ry = i % 2 === 0 ? raioExternoY : raioInternoY;
          const angulo = (i * Math.PI) / pontas - Math.PI / 2;
          const px = cx + Math.cos(angulo) * rx;
          const py = centroEstrelaY + Math.sin(angulo) * ry;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
      }

      ctx.closePath();
    }

    document.getElementById('seletor').addEventListener('change', function (evento) {
      const galeria = document.getElementById('galeria');
      galeria.innerHTML = '';
      redesenhos.length = 0;
      resetadoresBarras.length = 0;

      for (const arquivo of evento.target.files) {
        const img = new Image();
        img.src = URL.createObjectURL(arquivo);

        img.onload = function () {
          const canvas = document.createElement('canvas');
          canvas.width = tamanhoFinal;
          canvas.height = tamanhoFinal;
          atualizarCursoCanvases();

          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          const escalaBase = Math.max(tamanhoFinal / img.naturalWidth, tamanhoFinal / img.naturalHeight);
          let zoom = 1;
          let offsetX = 0;
          let offsetY = 0;

          // Caixa ajustável pelas barras laterais e superior/inferior
          let caixa = { x: 25, y: 25, w: 200, h: 200 };

          function resetarBarras() {
            caixa = { x: 25, y: 25, w: 200, h: 200 };
            desenhar();
          }

          function limitarOffsets() {
            const larguraDesenhada = img.naturalWidth * escalaBase * zoom;
            const alturaDesenhada = img.naturalHeight * escalaBase * zoom;

            const maxOffsetX = Math.max(0, (larguraDesenhada - tamanhoFinal) / 2);
            const maxOffsetY = Math.max(0, (alturaDesenhada - tamanhoFinal) / 2);

            offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, offsetX));
            offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, offsetY));
          }

          function obterDimensoesImagem() {
            limitarOffsets();
            const larguraDesenhada = img.naturalWidth * escalaBase * zoom;
            const alturaDesenhada = img.naturalHeight * escalaBase * zoom;
            const x = (tamanhoFinal - larguraDesenhada) / 2 + offsetX;
            const y = (tamanhoFinal - alturaDesenhada) / 2 + offsetY;
            return { x, y, larguraDesenhada, alturaDesenhada };
          }

          function detectarAlvoBarra(px, py) {
            const margem = 8;
            const pertoEsq = Math.abs(px - caixa.x) <= margem && py >= caixa.y - margem && py <= caixa.y + caixa.h + margem;
            const pertoDir = Math.abs(px - (caixa.x + caixa.w)) <= margem && py >= caixa.y - margem && py <= caixa.y + caixa.h + margem;
            const pertoTopo = Math.abs(py - caixa.y) <= margem && px >= caixa.x - margem && px <= caixa.x + caixa.w + margem;
            const pertoBase = Math.abs(py - (caixa.y + caixa.h)) <= margem && px >= caixa.x - margem && px <= caixa.x + caixa.w + margem;

            if (pertoEsq && pertoTopo) return 'nw';
            if (pertoDir && pertoTopo) return 'ne';
            if (pertoEsq && pertoBase) return 'sw';
            if (pertoDir && pertoBase) return 'se';
            if (pertoEsq) return 'left';
            if (pertoDir) return 'right';
            if (pertoTopo) return 'top';
            if (pertoBase) return 'bottom';
            if (px > caixa.x && px < caixa.x + caixa.w && py > caixa.y && py < caixa.y + caixa.h) {
              return 'move';
            }
            return null;
          }

          function cursorParaAlvo(alvo) {
            if (alvo === 'left' || alvo === 'right') return 'ew-resize';
            if (alvo === 'top' || alvo === 'bottom') return 'ns-resize';
            if (alvo === 'nw' || alvo === 'se') return 'nwse-resize';
            if (alvo === 'ne' || alvo === 'sw') return 'nesw-resize';
            if (alvo === 'move') return 'move';
            return 'default';
          }

          function desenhar(incluirGuiaBarras = true) {
            const { x, y, larguraDesenhada, alturaDesenhada } = obterDimensoesImagem();
            ctx.clearRect(0, 0, tamanhoFinal, tamanhoFinal);

            if (formatoAtual === 'barras') {
              if (incluirGuiaBarras && !contaGotasAtivo) {
                // Mostra imagem inteira escurecida fora da área selecionada pelas barras
                ctx.save();
                ctx.globalAlpha = 0.35;
                ctx.drawImage(img, x, y, larguraDesenhada, alturaDesenhada);
                ctx.restore();
              }

              ctx.save();
              ctx.beginPath();
              ctx.rect(caixa.x, caixa.y, caixa.w, caixa.h);
              ctx.clip();
              ctx.drawImage(img, x, y, larguraDesenhada, alturaDesenhada);
              ctx.restore();

              if (incluirGuiaBarras && !contaGotasAtivo) {
                // Borda da seleção e barras laterais/superior/inferior
                ctx.save();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.strokeRect(caixa.x, caixa.y, caixa.w, caixa.h);

                ctx.strokeStyle = '#0066cc';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 3]);
                ctx.strokeRect(caixa.x, caixa.y, caixa.w, caixa.h);
                ctx.setLineDash([]);

                // Barras laterais (esquerda e direita)
                const espessuraBarra = 5;
                const alturaBarraLateral = Math.min(36, caixa.h * 0.45);
                const larguraBarraHorizontal = Math.min(36, caixa.w * 0.45);

                ctx.fillStyle = '#0066cc';
                // Barra esquerda
                ctx.fillRect(
                  caixa.x - espessuraBarra / 2,
                  caixa.y + (caixa.h - alturaBarraLateral) / 2,
                  espessuraBarra,
                  alturaBarraLateral
                );
                // Barra direita
                ctx.fillRect(
                  caixa.x + caixa.w - espessuraBarra / 2,
                  caixa.y + (caixa.h - alturaBarraLateral) / 2,
                  espessuraBarra,
                  alturaBarraLateral
                );
                // Barra superior
                ctx.fillRect(
                  caixa.x + (caixa.w - larguraBarraHorizontal) / 2,
                  caixa.y - espessuraBarra / 2,
                  larguraBarraHorizontal,
                  espessuraBarra
                );
                // Barra inferior
                ctx.fillRect(
                  caixa.x + (caixa.w - larguraBarraHorizontal) / 2,
                  caixa.y + caixa.h - espessuraBarra / 2,
                  larguraBarraHorizontal,
                  espessuraBarra
                );
                ctx.restore();
              }
              return;
            }

            ctx.save();
            criarCaminhoEmCaixa(ctx, formatoAtual, 0, 0, tamanhoFinal, tamanhoFinal);
            ctx.clip();
            ctx.drawImage(img, x, y, larguraDesenhada, alturaDesenhada);
            ctx.restore();
          }

          redesenhos.push(() => desenhar(true));
          resetadoresBarras.push(resetarBarras);
          desenhar(true);

          let alvoArraste = null;
          let arrastandoImagem = false;
          let ultimoX = 0;
          let ultimoY = 0;

          function obterPontoCanvas(e) {
            const rect = canvas.getBoundingClientRect();
            return {
              x: (e.clientX - rect.left) * (canvas.width / rect.width),
              y: (e.clientY - rect.top) * (canvas.height / rect.height)
            };
          }

          canvas.addEventListener('pointerdown', function (e) {
            if (contaGotasAtivo) return;
            const pt = obterPontoCanvas(e);
            ultimoX = pt.x;
            ultimoY = pt.y;

            if (formatoAtual === 'barras') {
              alvoArraste = detectarAlvoBarra(pt.x, pt.y);
              if (alvoArraste) {
                canvas.setPointerCapture(e.pointerId);
              }
              return;
            }

            arrastandoImagem = true;
            canvas.setPointerCapture(e.pointerId);
          });

          canvas.addEventListener('pointermove', function (e) {
            if (contaGotasAtivo) return;
            const pt = obterPontoCanvas(e);

            if (formatoAtual === 'barras') {
              if (!alvoArraste) {
                canvas.style.cursor = cursorParaAlvo(detectarAlvoBarra(pt.x, pt.y));
                return;
              }

              const dx = pt.x - ultimoX;
              const dy = pt.y - ultimoY;
              ultimoX = pt.x;
              ultimoY = pt.y;

              if (alvoArraste === 'move') {
                caixa.x = Math.max(0, Math.min(tamanhoFinal - caixa.w, caixa.x + dx));
                caixa.y = Math.max(0, Math.min(tamanhoFinal - caixa.h, caixa.y + dy));
              } else {
                if (alvoArraste.includes('left') || alvoArraste.includes('w')) {
                  const novoX = Math.max(0, Math.min(caixa.x + caixa.w - tamanhoMinimoCaixa, caixa.x + dx));
                  caixa.w += caixa.x - novoX;
                  caixa.x = novoX;
                }
                if (alvoArraste.includes('right') || alvoArraste.includes('e')) {
                  caixa.w = Math.max(tamanhoMinimoCaixa, Math.min(tamanhoFinal - caixa.x, caixa.w + dx));
                }
                if (alvoArraste.includes('top') || alvoArraste.includes('n')) {
                  const novoY = Math.max(0, Math.min(caixa.y + caixa.h - tamanhoMinimoCaixa, caixa.y + dy));
                  caixa.h += caixa.y - novoY;
                  caixa.y = novoY;
                }
                if (alvoArraste.includes('bottom') || alvoArraste.includes('s')) {
                  caixa.h = Math.max(tamanhoMinimoCaixa, Math.min(tamanhoFinal - caixa.y, caixa.h + dy));
                }
              }

              desenhar(true);
              return;
            }

            if (!arrastandoImagem) return;
            const rect = canvas.getBoundingClientRect();
            const fatorX = canvas.width / rect.width;
            const fatorY = canvas.height / rect.height;

            offsetX += (e.clientX - (rect.left + ultimoX / fatorX)) * fatorX;
            offsetY += (e.clientY - (rect.top + ultimoY / fatorY)) * fatorY;
            ultimoX = pt.x;
            ultimoY = pt.y;

            desenhar(true);
          });

          canvas.addEventListener('pointerup', function (e) {
            alvoArraste = null;
            arrastandoImagem = false;
            if (canvas.hasPointerCapture(e.pointerId)) {
              canvas.releasePointerCapture(e.pointerId);
            }
          });

          canvas.addEventListener('wheel', function (e) {
            if (contaGotasAtivo || formatoAtual === 'barras') return;
            e.preventDefault();
            const fatorZoom = e.deltaY < 0 ? 1.08 : 0.92;
            zoom = Math.max(1, Math.min(5, zoom * fatorZoom));
            desenhar(true);
          }, { passive: false });

          canvas.addEventListener('click', function (e) {
            if (!contaGotasAtivo) return;

            const pt = obterPontoCanvas(e);
            const x = Math.floor(pt.x);
            const y = Math.floor(pt.y);
            const pixel = ctx.getImageData(x, y, 1, 1).data;

            if (pixel[3] === 0) return;

            const [r, g, b] = pixel;
            const hex = '#' + [r, g, b]
              .map(v => v.toString(16).padStart(2, '0'))
              .join('')
              .toUpperCase();
            const rgb = `rgb(${r}, ${g}, ${b})`;

            document.getElementById('amostra-cor').style.backgroundColor = hex;
            document.getElementById('texto-hex').textContent = hex;
            document.getElementById('texto-rgb').textContent = rgb;
          });

          function exportarPng250() {
            if (formatoAtual === 'barras') {
              const { x, y, larguraDesenhada, alturaDesenhada } = obterDimensoesImagem();
              const canvasExport = document.createElement('canvas');
              canvasExport.width = tamanhoFinal;
              canvasExport.height = tamanhoFinal;
              const ctxExport = canvasExport.getContext('2d');

              ctxExport.drawImage(
                img,
                x, y, larguraDesenhada, alturaDesenhada,
                -caixa.x * (tamanhoFinal / caixa.w),
                -caixa.y * (tamanhoFinal / caixa.h),
                larguraDesenhada * (tamanhoFinal / caixa.w),
                alturaDesenhada * (tamanhoFinal / caixa.h)
              );

              return canvasExport;
            }

            desenhar(false);
            const canvasLimpo = document.createElement('canvas');
            canvasLimpo.width = tamanhoFinal;
            canvasLimpo.height = tamanhoFinal;
            canvasLimpo.getContext('2d').drawImage(canvas, 0, 0);
            desenhar(true);
            return canvasLimpo;
          }

          const item = document.createElement('div');
          item.className = 'item';

          const botao = document.createElement('button');
          botao.textContent = 'Baixar PNG (250x250)';
          botao.onclick = function () {
            const alvoExport = exportarPng250();
            alvoExport.toBlob(function (blob) {
              const urlPng = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = urlPng;
              link.download = `${arquivo.name.replace(/\.[^.]+$/, '')}-${formatoAtual}-250x250.png`;
              link.click();
              setTimeout(() => URL.revokeObjectURL(urlPng), 1000);
            }, 'image/png');
          };

          item.appendChild(canvas);
          item.appendChild(botao);
          galeria.appendChild(item);
        };
      }
    });
  </script>

</body>
</html>
