<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Imagens Circulares (250x250) + Enquadramento + Conta-gotas</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .controles {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      padding: 12px;
      background: #f4f4f4;
      border-radius: 8px;
    }
    .painel-cor {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 15px;
      border-left: 2px solid #ccc;
    }
    .amostra-cor {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: 1px solid #999;
      background-color: #ffffff;
    }
    .dica {
      font-size: 13px;
      color: #444;
      margin-top: 10px;
    }
    .galeria { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    canvas {
      width: 250px;
      height: 250px;
      cursor: grab;
      touch-action: none;
    }
    canvas:active { cursor: grabbing; }
    canvas.modo-conta-gotas { cursor: crosshair; }
    button { padding: 8px 14px; cursor: pointer; }
    button.ativo { background-color: #0066cc; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="controles">
    <input type="file" id="seletor" multiple accept="image/*">

    <button id="btn-conta-gotas" type="button">Conta-gotas: Desativado</button>

    <div class="painel-cor">
      <div class="amostra-cor" id="amostra-cor" title="Cor selecionada"></div>
      <span id="texto-hex">#FFFFFF</span>
      <button type="button" onclick="copiarTexto('texto-hex', this)">Copiar HEX</button>
      <span id="texto-rgb">rgb(255, 255, 255)</span>
      <button type="button" onclick="copiarTexto('texto-rgb', this)">Copiar RGB</button>
    </div>
  </div>

  <div class="dica">
    <strong>Enquadramento:</strong> Arraste a imagem para escolher a área e use a roda do mouse para dar zoom. Ative o <strong>Conta-gotas</strong> para extrair cores.
  </div>

  <div class="galeria" id="galeria"></div>

  <script>
    let contaGotasAtivo = false;
    const btnContaGotas = document.getElementById('btn-conta-gotas');

    btnContaGotas.addEventListener('click', function () {
      contaGotasAtivo = !contaGotasAtivo;
      btnContaGotas.textContent = contaGotasAtivo
        ? 'Conta-gotas: Ativo (clique na foto)'
        : 'Conta-gotas: Desativado';
      btnContaGotas.classList.toggle('ativo', contaGotasAtivo);

      document.querySelectorAll('canvas').forEach(c => {
        c.classList.toggle('modo-conta-gotas', contaGotasAtivo);
      });
    });

    function copiarTexto(idElemento, botao) {
      const valor = document.getElementById(idElemento).textContent;
      navigator.clipboard.writeText(valor);
      const textoOriginal = botao.textContent;
      botao.textContent = 'Copiado!';
      setTimeout(() => botao.textContent = textoOriginal, 1200);
    }

    document.getElementById('seletor').addEventListener('change', function (evento) {
      const galeria = document.getElementById('galeria');
      galeria.innerHTML = '';

      for (const arquivo of evento.target.files) {
        const img = new Image();
        img.src = URL.createObjectURL(arquivo);

        img.onload = function () {
          const tamanhoFinal = 250;
          const canvas = document.createElement('canvas');
          canvas.width = tamanhoFinal;
          canvas.height = tamanhoFinal;
          if (contaGotasAtivo) canvas.classList.add('modo-conta-gotas');

          const ctx = canvas.getContext('2d', { willReadFrequently: true });

          // Escala base para cobrir todo o quadrado 250x250 sem deixar espaços vazios
          const escalaBase = Math.max(tamanhoFinal / img.naturalWidth, tamanhoFinal / img.naturalHeight);
          let zoom = 1;
          let offsetX = 0; // deslocamento em relação ao centro (em px do canvas)
          let offsetY = 0;

          function limitarOffsets() {
            const larguraDesenhada = img.naturalWidth * escalaBase * zoom;
            const alturaDesenhada = img.naturalHeight * escalaBase * zoom;

            const maxOffsetX = Math.max(0, (larguraDesenhada - tamanhoFinal) / 2);
            const maxOffsetY = Math.max(0, (alturaDesenhada - tamanhoFinal) / 2);

            offsetX = Math.max(-maxOffsetX, Math.min(maxOffsetX, offsetX));
            offsetY = Math.max(-maxOffsetY, Math.min(maxOffsetY, offsetY));
          }

          function desenhar() {
            limitarOffsets();

            const larguraDesenhada = img.naturalWidth * escalaBase * zoom;
            const alturaDesenhada = img.naturalHeight * escalaBase * zoom;
            const x = (tamanhoFinal - larguraDesenhada) / 2 + offsetX;
            const y = (tamanhoFinal - alturaDesenhada) / 2 + offsetY;

            ctx.clearRect(0, 0, tamanhoFinal, tamanhoFinal);
            ctx.save();
            ctx.beginPath();
            ctx.arc(tamanhoFinal / 2, tamanhoFinal / 2, tamanhoFinal / 2, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            ctx.drawImage(img, x, y, larguraDesenhada, alturaDesenhada);
            ctx.restore();
          }

          desenhar();

          // Arrastar para escolher a área desejada
          let arrastando = false;
          let ultimoX = 0;
          let ultimoY = 0;

          canvas.addEventListener('pointerdown', function (e) {
            if (contaGotasAtivo) return;
            arrastando = true;
            ultimoX = e.clientX;
            ultimoY = e.clientY;
            canvas.setPointerCapture(e.pointerId);
          });

          canvas.addEventListener('pointermove', function (e) {
            if (!arrastando || contaGotasAtivo) return;
            const rect = canvas.getBoundingClientRect();
            const fatorX = canvas.width / rect.width;
            const fatorY = canvas.height / rect.height;

            offsetX += (e.clientX - ultimoX) * fatorX;
            offsetY += (e.clientY - ultimoY) * fatorY;
            ultimoX = e.clientX;
            ultimoY = e.clientY;

            desenhar();
          });

          canvas.addEventListener('pointerup', function (e) {
            if (!arrastando) return;
            arrastando = false;
            if (canvas.hasPointerCapture(e.pointerId)) {
              canvas.releasePointerCapture(e.pointerId);
            }
          });

          // Zoom com a roda do mouse
          canvas.addEventListener('wheel', function (e) {
            if (contaGotasAtivo) return;
            e.preventDefault();
            const fatorZoom = e.deltaY < 0 ? 1.08 : 0.92;
            zoom = Math.max(1, Math.min(5, zoom * fatorZoom));
            desenhar();
          }, { passive: false });

          // Conta-gotas ao clicar
          canvas.addEventListener('click', function (e) {
            if (!contaGotasAtivo) return;

            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) * (canvas.width / rect.width));
            const y = Math.floor((e.clientY - rect.top) * (canvas.height / rect.height));
            const pixel = ctx.getImageData(x, y, 1, 1).data;

            if (pixel[3] === 0) return;

            const [r, g, b] = pixel;
            const hex = '#' + [r, g, b]
              .map(v => v.toString(16).padStart(2, '0'))
              .join('')
              .toUpperCase();
            const rgb = `rgb(${r}, ${g}, ${b})`;

            document.getElementById('amostra-cor').style.backgroundColor = hex;
            document.getElementById('texto-hex').textContent = hex;
            document.getElementById('texto-rgb').textContent = rgb;
          });

          // Gera o PNG de 250x250 exatamente com o enquadramento atual ao clicar em Baixar
          const item = document.createElement('div');
          item.className = 'item';

          const botao = document.createElement('button');
          botao.textContent = 'Baixar PNG (250x250)';
          botao.onclick = function () {
            canvas.toBlob(function (blob) {
              const urlPng = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = urlPng;
              link.download = arquivo.name.replace(/\.[^.]+$/, '') + '-250x250.png';
              link.click();
              setTimeout(() => URL.revokeObjectURL(urlPng), 1000);
            }, 'image/png');
          };

          item.appendChild(canvas);
          item.appendChild(botao);
          galeria.appendChild(item);
        };
      }
    });
  </script>

</body>
</html>
